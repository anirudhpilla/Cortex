
[project]
name = "cortex"
version = "0.2.0"
description = "GenAI document and codebase search"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "email-validator>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.3,<1",
    "pyjwt>=2.10,<3",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
    "langchain-core>=1.6.12",
    "langchain-text-splitters>=1.1.3",
    "langchain-community",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.2",
    "langchain-google-genai>=4.4.2",
    "pgvector>=0.5.1",
    "pypdf>=6.21.0",
    "python-dotenv>=1.2.3",
    "redis>=6,<7",
    "fastapi[standard]>=0.141.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
